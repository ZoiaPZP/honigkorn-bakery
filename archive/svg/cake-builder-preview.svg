<svg xmlns="http://www.w3.org/2000/svg" class="cake-svg" viewBox="0 0 400 320" data-filling="strawberry" style="--sponge:#F0CF8E;--cream:#FFFBF3;--fruit:#D9434B">
  <!-- Archived: self-drawn cake preview of the cake builder (replaced by photos).
       cake-builder.js used to set the CSS variables sponge, cream and fruit (colours), data-filling
       (strawberry, raspberry, cherry, none), cake-scale on #cake-body (.84 / .92 / 1) and the plaque text + width. -->
  <style><![CDATA[
.cake-svg { display: block; width: 100%; max-width: 440px; margin: 0 auto; overflow: visible; }
.cake-plate { fill: #FFFDF9; stroke: #E6D2B8; stroke-width: 2; }
.cake-svg [data-part] { transition: fill .45s cubic-bezier(.22,.61,.36,1); }
.cake-svg [data-part="sponge"] { fill: var(--sponge, #F0CF8E); }
.cake-svg [data-part="cream"] { fill: var(--cream, #FFFBF3); }
.cake-svg [data-part="fruit"] { fill: var(--fruit, #D9434B); }
.cake-rosettes circle { stroke: rgba(59, 38, 24, .1); stroke-width: 1; }
.cake-top-shine { fill: #fff; opacity: .25; }
.fruit-layer { transition: opacity .35s cubic-bezier(.22,.61,.36,1), fill .45s cubic-bezier(.22,.61,.36,1); }
.cake-svg[data-filling="none"] .fruit-layer { opacity: 0; }

.cake-body {
  transform: scale(var(--cake-scale, 1));
  transform-box: view-box;
  transform-origin: 200px 288px;
  transition: transform .5s cubic-bezier(.22,.61,.36,1);
}

.fruits {
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity .35s cubic-bezier(.22,.61,.36,1), transform .35s cubic-bezier(.22,.61,.36,1);
}
.cake-svg[data-filling="strawberry"] .fruits-strawberry,
.cake-svg[data-filling="raspberry"] .fruits-raspberry,
.cake-svg[data-filling="cherry"] .fruits-cherry { opacity: 1; transform: none; }
.fruits-strawberry .fruit-body { fill: #D9434B; }
.fruits-strawberry .fruit-leaf { fill: #6E8B3D; }
.fruits-strawberry .fruit-seed { fill: #F6E3BE; }
.fruits-raspberry .fruit-body { fill: #C2386A; stroke: #9C2550; stroke-width: .6; }
.fruits-cherry .fruit-body { fill: #8C1D2C; }
.fruits-cherry .fruit-stem { fill: none; stroke: #5B6B2E; stroke-width: 1.6; stroke-linecap: round; }
.fruits-cherry .fruit-shine { fill: #fff; opacity: .5; }

.cake-plaque {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .3s cubic-bezier(.22,.61,.36,1), transform .3s cubic-bezier(.22,.61,.36,1);
}
.cake-plaque.is-visible { opacity: 1; transform: none; }
.cake-plaque rect { fill: #4A2A1A; }
.cake-plaque text {
  fill: #F6E3BE;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 16px;
  font-style: italic;
}
  ]]></style>
