<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#F7DDA6"/><stop offset="1" stop-color="#EDBE6E"/>
    </radialGradient>
    <linearGradient id="loaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D99B4E"/><stop offset="1" stop-color="#8A5A2B"/>
    </linearGradient>
    <linearGradient id="crois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C67D"/><stop offset="1" stop-color="#BB7C22"/>
