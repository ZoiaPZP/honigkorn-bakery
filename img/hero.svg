      <rect x="118" y="150" width="4" height="210" rx="2"/>
      <ellipse cx="112" cy="176" rx="6" ry="13" transform="rotate(-25 112 176)"/><ellipse cx="128" cy="176" rx="6" ry="13" transform="rotate(25 128 176)"/>
      <ellipse cx="112" cy="200" rx="6" ry="13" transform="rotate(-25 112 200)"/><ellipse cx="128" cy="200" rx="6" ry="13" transform="rotate(25 128 200)"/>
      <ellipse cx="112" cy="224" rx="6" ry="13" transform="rotate(-25 112 224)"/><ellipse cx="128" cy="224" rx="6" ry="13" transform="rotate(25 128 224)"/>
      <ellipse cx="120" cy="154" rx="5.5" ry="12"/>
    </g>
    <g transform="rotate(22 410 360)">
      <rect x="408" y="160" width="4" height="200" rx="2"/>
      <ellipse cx="402" cy="186" rx="6" ry="13" transform="rotate(-25 402 186)"/><ellipse cx="418" cy="186" rx="6" ry="13" transform="rotate(25 418 186)"/>
      <ellipse cx="402" cy="210" rx="6" ry="13" transform="rotate(-25 402 210)"/><ellipse cx="418" cy="210" rx="6" ry="13" transform="rotate(25 418 210)"/>
      <ellipse cx="402" cy="234" rx="6" ry="13" transform="rotate(-25 402 234)"/><ellipse cx="418" cy="234" rx="6" ry="13" transform="rotate(25 418 234)"/>
