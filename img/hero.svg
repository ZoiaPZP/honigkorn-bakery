      <path d="M100 54q12-22-4-36" transform="rotate(144 100 54) translate(0 2)"/>
      <path d="M100 54q12-22-4-36" transform="rotate(216 100 54) translate(0 2)"/>
      <path d="M100 54q12-22-4-36" transform="rotate(288 100 54) translate(0 6)"/>
    </g>
    <ellipse cx="80" cy="34" rx="14" ry="6" fill="#fff" opacity=".22" transform="rotate(-25 80 34)"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFDF9">
    <path d="M96 116l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".9"/>
    <path d="M430 96l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".8"/>
    <circle cx="448" cy="160" r="4" opacity=".7"/>
    <circle cx="74" cy="200" r="3" opacity=".7"/>
