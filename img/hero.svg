  <g fill="none" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M236 216c-14-14 14-26 0-42s12-28 0-42"/>
    <path d="M276 206c-12-14 12-24 0-38s10-24 0-36"/>
    <path d="M314 216c-12-12 12-22 0-34"/>
  </g>

  <!-- board -->
  <ellipse cx="262" cy="412" rx="210" ry="18" fill="#3B2618" opacity=".14"/>
  <rect x="62" y="374" width="400" height="32" rx="16" fill="url(#board)"/>
  <rect x="78" y="378" width="368" height="4" rx="2" fill="#FFF4DE" opacity=".25"/>
  <circle cx="440" cy="390" r="5" fill="#5E3A1C"/>

  <!-- loaf -->
  <path d="M146 374c0-74 58-124 128-124s128 50 128 124z" fill="url(#loaf)"/>
  <path d="M176 336c10-38 38-62 76-72" stroke="#fff" stroke-opacity=".2" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M194 320c16-20 40-24 58-12M244 296c16-20 40-24 58-12M296 310c16-20 40-24 58-12" stroke="#F1D2A0" stroke-width="10" stroke-linecap="round" fill="none"/>
  <g fill="#F7E6C4">
    <ellipse cx="220" cy="350" rx="5" ry="2.4" transform="rotate(-20 220 350)"/>
    <ellipse cx="262" cy="338" rx="5" ry="2.4" transform="rotate(25 262 338)"/>
    <ellipse cx="300" cy="352" rx="5" ry="2.4" transform="rotate(-10 300 352)"/>
    <ellipse cx="340" cy="340" rx="5" ry="2.4" transform="rotate(30 340 340)"/>
    <ellipse cx="282" cy="276" rx="5" ry="2.4" transform="rotate(10 282 276)"/>
    <ellipse cx="364" cy="358" rx="5" ry="2.4" transform="rotate(-25 364 358)"/>
    <ellipse cx="190" cy="360" rx="5" ry="2.4" transform="rotate(15 190 360)"/>
  </g>

  <!-- croissant -->
  <g transform="translate(70 290)" fill="url(#crois)" stroke="#8A5A2B" stroke-opacity=".45" stroke-width="2.5">
    <ellipse cx="42" cy="78" rx="18" ry="11" transform="rotate(-40 42 78)"/>
    <ellipse cx="158" cy="78" rx="18" ry="11" transform="rotate(40 158 78)"/>
    <ellipse cx="66" cy="62" rx="24" ry="18" transform="rotate(-24 66 62)"/>
    <ellipse cx="134" cy="62" rx="24" ry="18" transform="rotate(24 134 62)"/>
    <ellipse cx="100" cy="54" rx="30" ry="27"/>
  </g>
  <g transform="translate(70 290)" fill="#fff" opacity=".28">
    <ellipse cx="92" cy="40" rx="13" ry="6" transform="rotate(-15 92 40)"/>
    <ellipse cx="60" cy="52" rx="8" ry="4" transform="rotate(-35 60 52)"/>
