    <radialGradient id="roll" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#F0BF72"/><stop offset="1" stop-color="#B07220"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B57B42"/><stop offset="1" stop-color="#8A5A2B"/>
    </linearGradient>
