  <circle cx="260" cy="236" r="214" fill="url(#bg)"/>
  <circle cx="260" cy="236" r="182" fill="none" stroke="#FFF4DE" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

