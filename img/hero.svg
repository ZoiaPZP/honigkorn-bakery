  <!-- roll -->
  <g transform="translate(300 300)">
    <ellipse cx="100" cy="54" rx="58" ry="40" fill="url(#roll)"/>
    <g stroke="#8A5A2B" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M100 54q12-22-4-36"/>
